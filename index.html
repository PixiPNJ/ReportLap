<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Menú Principal — Reportes</title>
<style>
  :root {
    --bg: #0f0f12;
    --card-bg: #1a1a20;
    --card-hover: #22222a;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: #6366f1;
    --accent-glow: rgba(99, 102, 241, 0.3);
    --radius: 16px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem 1rem;
  }

  .header {
    text-align: center;
    margin-bottom: 2rem;
    margin-top: 1rem;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
    width: 100%;
    max-width: 420px;
  }

  .card {
    position: relative;
    height: 160px;
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 1.2rem;
    border: 1px solid rgba(255,255,255,0.06);
    transition: all 0.3s ease;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    transition: transform 0.4s ease, filter 0.3s ease;
    z-index: 1;
  }

  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(15,15,18,0.1) 0%, rgba(15,15,18,0.85) 70%, rgba(15,15,18,0.98) 100%);
    z-index: 2;
  }

  .card:hover::before {
    transform: scale(1.08);
    filter: brightness(1.1);
  }

  .card:hover {
    border-color: var(--accent);
    box-shadow: 0 0 24px var(--accent-glow);
    transform: translateY(-2px);
  }

  .card-content {
    position: relative;
    z-index: 3;
  }

  .card-icon {
    font-size: 28px;
    margin-bottom: 6px;
  }

  .card-title {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.3px;
  }

  .card-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .card-arrow {
    position: absolute;
    top: 1rem;
    right: 1rem;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #fff;
    z-index: 3;
    transition: background 0.2s;
  }

  .card:hover .card-arrow {
    background: var(--accent);
  }

  /* Imágenes de fondo */
  .card-laptop::before { background-image: url('https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=800&q=80'); }
  .card-tablet::before { background-image: url('https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=800&q=80'); }
  .card-big::before { background-image: url('https://images.unsplash.com/photo-1501504905252-473c47e087f8?w=800&q=80'); }
  .card-about::before { background-image: url('https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&q=80'); }

  .footer {
    margin-top: auto;
    padding-top: 2rem;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
  }

  .footer a {
    color: var(--accent);
    text-decoration: none;
  }

  @media (min-width: 640px) {
    .grid {
      grid-template-columns: 1fr 1fr;
      max-width: 700px;
    }
    .card { height: 180px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📋 Centro de Reportes</h1>
  <p>Gestión de equipos e incidencias</p>
</div>

<div class="grid">
  <a href="reporte_laptops.html" class="card card-laptop">
    <div class="card-arrow">→</div>
    <div class="card-content">
      <div class="card-icon">💻</div>
      <div class="card-title">Reporte Laptops</div>
      <div class="card-desc">41 laptops — HP, Dell 3520, Dell 3593</div>
    </div>
  </a>

  <a href="reporte_tablets_carro.html" class="card card-tablet">
    <div class="card-arrow">→</div>
    <div class="card-content">
      <div class="card-icon">📱</div>
      <div class="card-title">Reporte Tablets</div>
      <div class="card-desc">Inventario de tablets</div>
    </div>
  </a>

  <a href="reporte_big_tablet.html" class="card card-big">
    <div class="card-arrow">→</div>
    <div class="card-content">
      <div class="card-icon">📺</div>
      <div class="card-title">Reporte Big Tablets</div>
      <div class="card-desc">Pizarras interactivas</div>
    </div>
  </a>

  <a href="https://github.com/PixiPNJ" target="_blank" rel="noopener" class="card card-about">
    <div class="card-arrow">↗</div>
    <div class="card-content">
      <div class="card-icon">👤</div>
      <div class="card-title">About Me</div>
      <div class="card-desc">Mi perfil de GitHub</div>
    </div>
  </a>
</div>

<div class="footer">
  Hecho con ❤️ — <a href="https://github.com/PixiPNJ target="_blank" rel="noopener">PixiPNJ</a>
</div>

</body>
</html>
